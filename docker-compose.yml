services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_isp_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      APP_NAME: "${APP_NAME:-Smart ISP}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-smart_isp}
      DB_USERNAME: ${DB_USERNAME:-smart_isp_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
      RUN_MIGRATIONS: "true"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: smart_isp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-smart_isp}
      MYSQL_USER: ${DB_USERNAME:-smart_isp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  db_data:
