services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: smart_isp_app:latest
    container_name: smart_isp_app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      APP_NAME: "${APP_NAME:-Smart ISP}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-}"
      APP_PORT: "${APP_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-127.0.0.1}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-mikrotik_billing}"
      DB_USERNAME: "${DB_USERNAME:-billing_user}"
      DB_PASSWORD: "${DB_PASSWORD:-billing_pass}"
      RUN_MIGRATIONS: "true"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: smart_isp_db
    restart: unless-stopped
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-mikrotik_billing}
      MYSQL_USER: ${DB_USERNAME:-billing_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-billing_pass}
      MYSQL_TCP_PORT: ${DB_PORT:-3306}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  db_data:
